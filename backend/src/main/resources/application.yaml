spring:
  application:
    name: zasvet
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zasvet}
    username: ${DB_USER:zasvet}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  config:
    import: optional:file:../deploy/.env[.properties]